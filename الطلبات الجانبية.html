    {name:'سلطة يوتيرن كبيرة', price:1900, img:'سلطه يوترن.jpg'},

  const container = document.getElementById('meals');

  meals.forEach((meal, i) => {
    const card = document.createElement('div');
    card.className = 'meal';
    
    const isToast = meal.name.startsWith('توست');
    const breadHTML = isToast ? `
      <div class="bread-type">
        <input type="radio" id="white${i}" name="bread${i}" value="أبيض" checked>
        <label for="white${i}">أبيض</label>
        <input type="radio" id="brown${i}" name="bread${i}" value="أسمر">
        <label for="brown${i}">أسمر</label>
      </div>
    ` : '';

    card.innerHTML = `
     <button class="details-btn" onclick="toggleDetails(${i})">التفاصيل</button>
    <div class="details-box" id="detailsBox${i}">
      <button class="close-details" onclick="toggleDetails(${i})">✕</button>
      <strong>المكونات:</strong><br>${meal.ingredients}
    </div>
      <img src="${meal.img}" alt="${meal.name}">
      <h3>${meal.name}</h3>
      <div class="price" id="price${i}">${meal.price} ر.ي</div>
      <div class="qty-control">
        <button onclick="changeQty(${i}, -1)">-</button>
        <span id="qty${i}">1</span>
        <button onclick="changeQty(${i}, 1)">+</button>
      </div>
      ${breadHTML}
      <button class="add-btn" onclick="addToTable(${i})">إضافة إلى الطاولة</button>
    `;
    container.appendChild(card);
  });
   // دالة التفاصيل
function toggleDetails(i){
  const box=document.getElementById('detailsBox'+i);
  box.classList.toggle('show');
}

  function changeQty(index, change) {
    const qtyEl = document.getElementById('qty' + index);
    let qty = parseInt(qtyEl.textContent) + change;
    if (qty < 1) qty = 1;
    qtyEl.textContent = qty;
    const priceEl = document.getElementById('price' + index);
    priceEl.textContent = (meals[index].price * qty) + " ر.ي";
  }

  function addToTable(index) {
    const confirmAdd = confirm("هل تريد إضافة هذه الوجبة إلى الطاولة؟");
    if (!confirmAdd) return;

    const qty = parseInt(document.getElementById('qty' + index).textContent);
    const selectedBread = document.querySelector(`input[name="bread${index}"]:checked`);
    const bread = selectedBread ? selectedBread.value : "بدون اختيار";

    const item = { 
      name: meals[index].name + " - خبز: " + bread, 
      price: meals[index].price, 
      quantity: qty, 
      image: meals[index].img 
    };

    let cart = JSON.parse(localStorage.getItem('cartItems')) || [];
    const existing = cart.find(i => i.name === item.name);
    if (existing) existing.quantity += qty;
    else cart.push(item);
    localStorage.setItem('cartItems', JSON.stringify(cart));

    alert("✅ تمت إضافة الوجبة إلى الطاولة بنجاح!");
  }
</script>

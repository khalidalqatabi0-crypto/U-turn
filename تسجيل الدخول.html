<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>يوتيرن | تسجيل دخول و إنشاء حساب</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@500;700&display=swap');

body {
  margin: 0;
  padding: 0;
  font-family: 'Cairo', sans-serif;
  background: url('العائدين_الى_صنعاء.jpg') no-repeat center center/cover;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.container {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(10px);
  padding: 40px 30px;
  border-radius: 25px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  max-width: 400px;
  width: 90%;
  color: #fff;
  text-align: center;
  position: relative;
}

.container h1 {
  color: #f5b301;
  margin-bottom: 20px;
}

.container hr {
  border: 1px solid #f5b301;
  margin-bottom: 20px;
}

label {
  display: block;
  text-align: right;
  margin: 10px 0 5px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 10px;
  border-radius: 12px;
  border: 1px solid #555;
  background: rgba(255,255,255,0.1);
  color: #fff;
  font-size: 16px;
  margin-bottom: 15px;
}

input::placeholder { color: #ccc; }

button {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 12px;
  background: #f5b301;
  color: #222;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #222;
  color: #f5b301;
  transform: scale(1.05);
}

p {
  margin-top: 15px;
  font-size: 14px;
}

p a {
  color: #f5b301;
  text-decoration: none;
  font-weight: bold;
}

p a:hover { text-decoration: underline; }

.options {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  font-size: 14px;
}

.options a { color: #f5b301; text-decoration: none; }
.options a:hover { text-decoration: underline; }

form { display: flex; flex-direction: column; }
.homeBox {
  position: absolute;
  top: 20px;
  left: 20px;
  background: rgba(245, 179, 1, 0.9);
  padding: 10px 20px;
  border-radius: 12px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.4);
  transition: 0.3s;
  text-align: center;
   margin: 0 auto 20px auto;
}

.homeBox a {
  color: #222;
  font-weight: bold;
  text-decoration: none;
}

.homeBox:hover {
  background: #222;
}

.homeBox:hover a {
  color: #f5b301;
}
</style>
</head>
<body>
<nav>
  <div class="homeBox">
    <a href="index.html">الرجوع الى الصفحة الرئيسية</a>
  </div>
</nav>
<div class="container" id="authContainer">
  <h1 id="formTitle">تسجيل الدخول</h1>
  <hr>
  
  <form id="authForm">
    <label for="email">البريد الالكتروني</label>
    <input type="email" id="email" placeholder="ادخل البريد الالكتروني" required>
    
    <label for="password">كلمة المرور</label>
    <input type="password" id="password" placeholder="ادخل كلمة المرور" required>
    
    <div class="options" id="loginOptions">
      <label><input type="checkbox" id="remember"> تذكرني</label>
      <a href="#">نسيت كلمة المرور؟</a>
    </div>
    
    <button type="submit" id="submitBtn">دخول</button>
    <p id="toggleText">ليس لديك حساب؟ <a href="#" id="toggleForm">إنشاء حساب جديد</a></p>
  </form>
</div>

<script>
// تخزين الحسابات في localStorage
let isLogin = true;

const authForm = document.getElementById('authForm');
const formTitle = document.getElementById('formTitle');
const submitBtn = document.getElementById('submitBtn');
const toggleFormLink = document.getElementById('toggleForm');
const toggleText = document.getElementById('toggleText');

toggleFormLink.addEventListener('click', e => {
  e.preventDefault();
  isLogin = !isLogin;
  if(isLogin){
    formTitle.textContent = "تسجيل الدخول";
    submitBtn.textContent = "دخول";
    toggleText.innerHTML = 'ليس لديك حساب؟ <a href="#" id="toggleForm">إنشاء حساب جديد</a>';
  } else {
    formTitle.textContent = "إنشاء حساب جديد";
    submitBtn.textContent = "تسجيل";
    toggleText.innerHTML = 'لديك حساب؟ <a href="#" id="toggleForm">تسجيل الدخول</a>';
  }
});

authForm.addEventListener('submit', e => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value.trim();

  let users = JSON.parse(localStorage.getItem('users')) || [];

  if(isLogin){
    const user = users.find(u => u.email === email && u.password === password);
    if(user){
      alert(`مرحباً ${email}، تم تسجيل الدخول بنجاح!`);
      localStorage.setItem('currentUser', JSON.stringify(user));
      // هنا يمكنك إعادة توجيه المستخدم إلى صفحة الطاولة أو الطلبات
      window.location.href = "الطاولة.html";
    } else {
      alert("البريد الالكتروني أو كلمة المرور خاطئة!");
    }
  } else {
    const exists = users.find(u => u.email === email);
    if(exists){
      alert("هذا البريد مسجل مسبقاً!");
    } else {
      users.push({email,password});
      localStorage.setItem('users', JSON.stringify(users));
      alert("تم إنشاء الحساب بنجاح، يمكنك تسجيل الدخول الآن!");
      isLogin = true;
      formTitle.textContent = "تسجيل الدخول";
      submitBtn.textContent = "دخول";
      toggleText.innerHTML = 'ليس لديك حساب؟ <a href="#" id="toggleForm">إنشاء حساب جديد</a>';
      authForm.reset();
    }
  }
});
</script>

</body>
</html>
